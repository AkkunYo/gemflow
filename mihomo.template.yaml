# Mihomo 基础模板 (由 start.sh / run_local.py 动态注入 proxy-providers 与 listeners)

mode: rule
log-level: info
allow-lan: false
bind-address: '*'
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

# 默认直连代理
proxies:
  - name: "🟢 直连"
    type: direct
    udp: true

best: &best
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 180
  tolerance: 50
  lazy: false

# 基础策略组
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [♻️ 自动选择, 🌐 全部节点, 🟢 直连]}
  - {name: ♻️ 自动选择, <<: *best, include-all: true, filter: "^((?!(直连|Direct|DIRECT)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true, filter: "^((?!(直连|Direct|DIRECT)).)*$"}
# __WORKER_GROUPS__  (由 mihomo_config.py 注入各 Worker 专属策略组，勿删除此标记)

rules:
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - MATCH,🚀 节点选择
